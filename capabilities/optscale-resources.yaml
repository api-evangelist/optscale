naftiko: 1.0.0-alpha2
info:
  label: OptScale REST API — Resources
  description: 'OptScale REST API — Resources. 1 operations. Lead operation: List cloud resources for a cloud account. Self-contained
    Naftiko capability covering one Optscale business surface.'
  tags:
  - Optscale
  - Resources
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    OPTSCALE_API_KEY: OPTSCALE_API_KEY
capability:
  consumes:
  - type: http
    namespace: optscale-resources
    baseUri: https://{host}/restapi/v2
    description: OptScale REST API — Resources business capability. Self-contained, no shared references.
    resources:
    - name: cloud_accounts-cloud_account_id-cloud_resources
      path: /cloud_accounts/{cloud_account_id}/cloud_resources
      operations:
      - name: listcloudresources
        method: GET
        description: List cloud resources for a cloud account
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.OPTSCALE_API_KEY}}'
  exposes:
  - type: rest
    namespace: optscale-resources-rest
    port: 8080
    description: REST adapter for OptScale REST API — Resources. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/cloud-accounts/{cloud-account-id}/cloud-resources
      name: cloud-accounts-cloud-account-id-cloud-resources
      description: REST surface for cloud_accounts-cloud_account_id-cloud_resources.
      operations:
      - method: GET
        name: listcloudresources
        description: List cloud resources for a cloud account
        call: optscale-resources.listcloudresources
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: optscale-resources-mcp
    port: 9090
    transport: http
    description: MCP adapter for OptScale REST API — Resources. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-cloud-resources-cloud-account
      description: List cloud resources for a cloud account
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: optscale-resources.listcloudresources
      outputParameters:
      - type: object
        mapping: $.
