naftiko: 1.0.0-alpha2
info:
  label: OptScale REST API — Optimizations
  description: 'OptScale REST API — Optimizations. 1 operations. Lead operation: List optimization recommendations. Self-contained
    Naftiko capability covering one Optscale business surface.'
  tags:
  - Optscale
  - Optimizations
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    OPTSCALE_API_KEY: OPTSCALE_API_KEY
capability:
  consumes:
  - type: http
    namespace: optscale-optimizations
    baseUri: https://{host}/restapi/v2
    description: OptScale REST API — Optimizations business capability. Self-contained, no shared references.
    resources:
    - name: organizations-organization_id-optimizations
      path: /organizations/{organization_id}/optimizations
      operations:
      - name: listoptimizations
        method: GET
        description: List optimization recommendations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.OPTSCALE_API_KEY}}'
  exposes:
  - type: rest
    namespace: optscale-optimizations-rest
    port: 8080
    description: REST adapter for OptScale REST API — Optimizations. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/organizations/{organization-id}/optimizations
      name: organizations-organization-id-optimizations
      description: REST surface for organizations-organization_id-optimizations.
      operations:
      - method: GET
        name: listoptimizations
        description: List optimization recommendations
        call: optscale-optimizations.listoptimizations
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: optscale-optimizations-mcp
    port: 9090
    transport: http
    description: MCP adapter for OptScale REST API — Optimizations. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-optimization-recommendations
      description: List optimization recommendations
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: optscale-optimizations.listoptimizations
      outputParameters:
      - type: object
        mapping: $.
