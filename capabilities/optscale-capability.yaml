        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createcloudaccount
        method: POST
        description: Create a cloud account connection
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: cloud-accounts-cloud-account-id
      path: /cloud_accounts/{cloud_account_id}
      operations:
      - name: getcloudaccount
        method: GET
        description: Get cloud account
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deletecloudaccount
        method: DELETE
        description: Disconnect a cloud account
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: organizations-organization-id-employees
      path: /organizations/{organization_id}/employees
      operations:
      - name: listemployees
        method: GET
        description: List organization employees
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: organizations-organization-id-pools
      path: /organizations/{organization_id}/pools
      operations:
      - name: listpools
        method: GET
        description: List pools
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createpool
        method: POST
        description: Create a pool
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: pools-pool-id
      path: /pools/{pool_id}
      operations:
      - name: getpool
        method: GET
        description: Get pool
        inputParameters:
        - name: pool_id
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: cloud-accounts-cloud-account-id-cloud-resources
      path: /cloud_accounts/{cloud_account_id}/cloud_resources
